# 代理工具 clashoo apk 版 (kenzok8/openwrt-clashoo)
name: Build 25.12 clashoo

on:
  schedule:
    - cron: "1 22 * * *"  # 北京时间早上 6 点 01
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Clone makeself repository
        run: git clone https://github.com/megastep/makeself.git

      - name: Fetch latest release info
        run: |
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/kenzok8/openwrt-clashoo/releases \
            | jq 'map(select(.prerelease==false)) | sort_by(.published_at) | last' \
            > release.json

      - name: Parse asset download URLs
        run: |
          X86_URL=$(jq -r '.assets[] | select(.name | test("^clashoo-.*-x86_64\\.apk$")) | .browser_download_url' release.json | head -n1)
          ARM_URL=$(jq -r '.assets[] | select(.name | test("^clashoo-.*-aarch64_generic\\.apk$")) | .browser_download_url' release.json | head -n1)
          A53_URL=$(jq -r '.assets[] | select(.name | test("^clashoo-.*-aarch64_cortex-a53\\.apk$")) | .browser_download_url' release.json | head -n1)
          LUCI_URL=$(jq -r '.assets[] | select(.name | test("^luci-app-clashoo-.*\\.apk$")) | .browser_download_url' release.json | head -n1)
          I18N_URL=$(jq -r '.assets[] | select(.name | test("^luci-i18n-clashoo-zh-cn-.*\\.apk$")) | .browser_download_url' release.json | head -n1)

          echo "X86_URL=$X86_URL" >> $GITHUB_ENV
          echo "ARM_URL=$ARM_URL" >> $GITHUB_ENV
          echo "A53_URL=$A53_URL" >> $GITHUB_ENV
          echo "LUCI_URL=$LUCI_URL" >> $GITHUB_ENV
          echo "I18N_URL=$I18N_URL" >> $GITHUB_ENV

          # 版本号: clashoo-2026.09.14.dc66a8a-r1-x86_64.apk -> 2026.09.14.dc66a8a-r1
          VERSION=$(echo "$X86_URL" | sed -E 's#.*/clashoo-(.+)-x86_64\.apk#\1#')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "提取到版本号: $VERSION"

      - name: Download apk files
        run: |
          mkdir -p x86 arm64 a53
          wget "$X86_URL" -P x86/ 2>/dev/null || echo "⚠️ 无 x86 资产"
          wget "$ARM_URL" -P arm64/ 2>/dev/null || echo "⚠️ 无 aarch64_generic 资产"
          wget "$A53_URL" -P a53/ 2>/dev/null || echo "⚠️ 无 aarch64_cortex-a53 资产"
          for d in x86 arm64 a53; do
            wget "$LUCI_URL" -P $d/ 2>/dev/null || true
            wget "$I18N_URL" -P $d/ 2>/dev/null || true
          done
          ls -lh */*.apk 2>/dev/null | cat

      - name: Create install.sh scripts
        run: |
          cp shell/install25.sh x86/install.sh
          cp shell/install25.sh arm64/install.sh
          cp shell/install25.sh a53/install.sh
          chmod +x x86/install.sh arm64/install.sh a53/install.sh

      - name: Normalize apk file names (规范为 name-version.apk, imagebuilder 本地索引依赖)
        run: python3 shell/normalize_apk_names.py

      - name: Move directories to makeself
        run: |
          mv x86 makeself/
          mv arm64 makeself/
          mv a53 makeself/

      - name: Create self-extracting packages
        run: |
          cd makeself
          [ -n "$(ls x86/*.apk 2>/dev/null)" ] && ./makeself.sh x86/ 25-clashoo_${VERSION}_x86_64.run "by github action" ./install.sh || echo "跳过 x86"
          [ -n "$(ls arm64/*.apk 2>/dev/null)" ] && ./makeself.sh arm64/ 25-clashoo_${VERSION}_aarch64_generic.run "by github action" ./install.sh || echo "跳过 aarch64_generic"
          [ -n "$(ls a53/*.apk 2>/dev/null)" ] && ./makeself.sh a53/ 25-clashoo_${VERSION}_aarch64_cortex-a53.run "by github action" ./install.sh || echo "跳过 aarch64_cortex-a53"

      - name: Check file sizes
        run: ls -lh makeself/*.run

      - name: Set tag name
        id: vars
        run: |
          TODAY=$(date -u -d '+8 hour' +'%Y-%m-%d')
          echo "tag_name=$TODAY" >> $GITHUB_ENV

      - name: Upload run files as release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.tag_name }}
          name: "Daily Build - ${{ env.tag_name }}"
          files: makeself/*.run
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
             <p align="left">
              <img src="https://img.shields.io/github/downloads/passengerya/CloudRunFilesBuilder/${{ env.tag_name }}/total?style=for-the-badge&label=%E4%BB%8A%E6%97%A5%E4%B8%8B%E8%BD%BD%E6%AC%A1%E6%95%B0&labelColor=blue&color=black"/>
             </p>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Sync Store (builder 全部构建完成后即时触发同步)
        if: success()
        env:
          SYNC_DISPATCH_TOKEN: ${{ secrets.SYNC_DISPATCH_TOKEN }}
        run: |
          # 门控+轮询: 其它构建结束时仍有 post 阶段(状态短暂保持 in_progress),
          # 需等待其彻底结束后再判断, 避免并发完成时无人通知
          for i in 1 2 3 4 5 6; do
            others=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/passengerya/CloudRunFilesBuilder/actions/runs?per_page=100" \
              | jq --argjson rid "$GITHUB_RUN_ID" '[.workflow_runs[] | select(.id != $rid and (.status == "in_progress" or .status == "queued"))] | length')
            if [ "$others" = "0" ]; then
              code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                -H "Authorization: token $SYNC_DISPATCH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/passengerya/AutoBuildImmortalTWrt/dispatches" \
                -d '{"event_type":"builder-done"}')
              echo "✅ 已通知 Sync Store (HTTP $code)"
              exit 0
            fi
            echo "⏳ 仍有 $others 个构建运行中, 15s 后重试 ($i/6)"
            sleep 15
          done
          echo "⏳ 6 次检查后仍有构建运行中, 放弃本次通知(由最后完成者或 23:00 UTC 定时兜底)"


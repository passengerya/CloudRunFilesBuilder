# 极光主题 aurora apk 版 (eamonxg/luci-theme-aurora)
name: Build 25.12 AuroraTheme

on:
  schedule:
    - cron: "23 22 * * *"  # 北京时间早上 6 点 23
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Clone makeself repository
        run: git clone https://github.com/megastep/makeself.git

      - name: Fetch latest release info
        run: |
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/eamonxg/luci-theme-aurora/releases \
            | jq 'map(select(.prerelease==false)) | sort_by(.published_at) | last' \
            > release.json

      - name: Parse asset download URLs
        run: |
          THEME_URL=$(jq -r '.assets[] | select(.name | test("^luci-theme-aurora-.*\\.apk$")) | .browser_download_url' release.json | head -n1)
          echo "THEME_URL=$THEME_URL" >> $GITHUB_ENV

          # 版本号: luci-theme-aurora-1.3.0-r20260830.apk -> 1.3.0-r20260830
          VERSION=$(echo "$THEME_URL" | sed -E 's#.*/luci-theme-aurora-(.+)\.apk#\1#')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "提取到版本号: $VERSION"

      - name: Download apk files
        run: |
          mkdir -p aurora
          wget "$THEME_URL" -P aurora/
          ls -lh aurora/

      - name: Create install.sh script
        run: |
          cp shell/install25.sh aurora/install.sh
          chmod +x aurora/install.sh

      - name: Normalize apk file names (规范为 name-version.apk, imagebuilder 本地索引依赖)
        run: python3 shell/normalize_apk_names.py

      - name: Move directory to makeself
        run: mv aurora makeself/

      - name: Create self-extracting package
        run: |
          cd makeself
          ./makeself.sh aurora/ 25-luci-theme-aurora-${VERSION}_all.run "by github action" ./install.sh

      - name: Check file sizes
        run: ls -lh makeself/*.run

      - name: Set tag name
        id: vars
        run: |
          TODAY=$(date -u -d '+8 hour' +'%Y-%m-%d')
          echo "tag_name=$TODAY" >> $GITHUB_ENV

      - name: Upload run files as release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.tag_name }}
          name: "Daily Build - ${{ env.tag_name }}"
          files: makeself/*.run
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
             <p align="left">
              <img src="https://img.shields.io/github/downloads/passengerya/CloudRunFilesBuilder/${{ env.tag_name }}/total?style=for-the-badge&label=%E4%BB%8A%E6%97%A5%E4%B8%8B%E8%BD%BD%E6%AC%A1%E6%95%B0&labelColor=blue&color=black"/>
             </p>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Sync Store (builder 全部构建完成后即时触发同步)
        if: success() && ${{ secrets.SYNC_DISPATCH_TOKEN != '' }}
        env:
          SYNC_DISPATCH_TOKEN: ${{ secrets.SYNC_DISPATCH_TOKEN }}
        run: |
          # 门控: 本仓库还有其它运行中/排队的构建时不通知, 由最后完成的工作流通知
          others=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/passengerya/CloudRunFilesBuilder/actions/runs?per_page=100" \
            | jq --argjson rid "$GITHUB_RUN_ID" '[.workflow_runs[] | select(.id != $rid and (.status == "in_progress" or .status == "queued"))] | length')
          if [ "$others" != "0" ]; then
            echo "⏳ 仍有 $others 个构建运行中, 由最后完成者通知 Sync Store"
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: token $SYNC_DISPATCH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/passengerya/AutoBuildImmortalTWrt/dispatches" \
            -d '{"event_type":"builder-done"}')
          echo "✅ 已通知 Sync Store (HTTP $code)"


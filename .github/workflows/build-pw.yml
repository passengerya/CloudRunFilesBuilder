name: Build 25.12 PassWall

on:
  schedule:
    - cron: "8 22 * * *"  # 北京时间早上 6 点 08
  workflow_dispatch:

jobs:
  build_passwall_2512:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y makeself curl wget

      - name: 赋予脚本执行权限
        run: chmod +x shell/pw25.sh

      - name: 执行打包脚本
        run: ./shell/pw25.sh --all

      #- name: 上传 Artifacts（每个架构的 APK）
        #uses: actions/upload-artifact@v7
        #with:
          #name: passwall-apks
          #path: dist/passwall-run/apks/
          #retention-days: 7

      - name: Set tag name
        id: vars
        run: |
          TODAY=$(date -u -d '+8 hour' +'%Y-%m-%d')
          echo "tag_name=$TODAY" >> $GITHUB_ENV

      - name: 上传 Release（仅 .run 文件）
        uses: softprops/action-gh-release@v3
        with:
          files: dist/passwall-run/run/*.run
          tag_name: ${{ env.tag_name }}
          name: "Daily Build - ${{ env.tag_name }}"
          draft: false
          overwrite_files: true
          body: |
             <p align="left">
              <img src="https://img.shields.io/github/downloads/passengerya/CloudRunFilesBuilder/${{ env.tag_name }}/total?style=for-the-badge&label=%E4%BB%8A%E6%97%A5%E4%B8%8B%E8%BD%BD%E6%AC%A1%E6%95%B0&labelColor=blue&color=black"/>
              <a href="https://wkdaily.cpolar.cn/archives/1">
                <img src="https://img.shields.io/badge/可套用国内加速站下载-FC7C0D?logo=github&logoColor=fff&labelColor=000&style=for-the-badge"/>
              </a>
             </p>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Sync Store (builder 全部构建完成后即时触发同步)
        if: success()
        env:
          SYNC_DISPATCH_TOKEN: ${{ secrets.SYNC_DISPATCH_TOKEN }}
        run: |
          # 门控: 本仓库还有其它运行中/排队的构建时不通知, 由最后完成的工作流通知
          others=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/passengerya/CloudRunFilesBuilder/actions/runs?per_page=100" \
            | jq --argjson rid "$GITHUB_RUN_ID" '[.workflow_runs[] | select(.id != $rid and (.status == "in_progress" or .status == "queued"))] | length')
          if [ "$others" != "0" ]; then
            echo "⏳ 仍有 $others 个构建运行中, 由最后完成者通知 Sync Store"
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: token $SYNC_DISPATCH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/passengerya/AutoBuildImmortalTWrt/dispatches" \
            -d '{"event_type":"builder-done"}')
          echo "✅ 已通知 Sync Store (HTTP $code)"


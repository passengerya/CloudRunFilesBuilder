# 应用过滤 OpenAppFilter apk 版 (destan19) —— 三件套打包
# destan19 安装指南要求 kmod-oaf + appfilter(引擎) + luci-app-oaf(UI) 三件套齐全才能工作;
# 历史版本只打包了 luci 两个 apk → 固件里引擎缺失, 用户列表无法收集(防错 #45)。
# 本工作流额外下载每目标内核 tarball, 取出引擎与内核模块, 并把 kmod-oaf 的
# kernel 钉扎依赖改写为 fuzzy 前缀匹配(见 shell/patch_apk3.py):
#   kernel=6.12.94~<OpenWrt配置哈希>-r1  →  kernel~6.12.94
# 使 kmod 在任何 imm 同内核版本的目标上可安装(imm 的 kernel 版本哈希按目标不同)。
name: Build 25.12 OpenAppFilter

on:
  schedule:
    - cron: "11 22 * * *"  # 北京时间早上 6 点 11
  workflow_dispatch:
    inputs:
      kernel_version:
        description: '匹配的内核版本(imm 25.12.1 = 6.12.94; 上游按 openwrt 25.12.x 发布不同内核 tarball)'
        required: false
        default: '6.12.94'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Clone makeself repository
        run: git clone https://github.com/megastep/makeself.git

      - name: Fetch latest release info
        run: |
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/destan19/OpenAppFilter/releases \
            | jq 'map(select(.prerelease==false)) | sort_by(.published_at) | last' \
            > release.json

      - name: Parse asset download URLs
        env:
          KVER: ${{ inputs.kernel_version || '6.12.94' }}
        run: |
          MAIN_URL=$(jq -r '.assets[] | select(.name | test("^luci-app-oaf-.*\\.apk$")) | .browser_download_url' release.json | head -n1)
          I18N_URL=$(jq -r '.assets[] | select(.name | test("^luci-i18n-oaf-zh-cn.*\\.apk$")) | .browser_download_url' release.json | head -n1)
          # 每目标内核 tarball: 仅取与内核版本匹配的(定时触发时 inputs 为空, 用默认 6.12.94)
          X86_TARBALL=$(jq -r --arg kv "$KVER" \
            '.assets[] | select(.name | test("^openwrt[0-9.]+-oaf_.*-x86_64-kernel_" + $kv + "\\.tar\\.gz$")) | .browser_download_url' release.json | head -n1)
          ARM_TARBALL=$(jq -r --arg kv "$KVER" \
            '.assets[] | select(.name | test("^openwrt[0-9.]+-oaf_.*-rockchip_armv8-kernel_" + $kv + "\\.tar\\.gz$")) | .browser_download_url' release.json | head -n1)
          echo "MAIN_URL=$MAIN_URL" >> $GITHUB_ENV
          echo "I18N_URL=$I18N_URL" >> $GITHUB_ENV
          echo "X86_TARBALL=$X86_TARBALL" >> $GITHUB_ENV
          echo "ARM_TARBALL=$ARM_TARBALL" >> $GITHUB_ENV
          [ -n "$MAIN_URL" ] && [ "$MAIN_URL" != "null" ] || { echo "❌ 未找到 luci-app-oaf apk 资产"; exit 1; }
          [ -n "$X86_TARBALL" ] && [ "$X86_TARBALL" != "null" ] || { echo "❌ 未找到 x86_64 内核 $KVER tarball(上游内核版本已变更? 检查 release 资产与 imm 默认 imagebuilder 内核)"; exit 1; }
          [ -n "$ARM_TARBALL" ] && [ "$ARM_TARBALL" != "null" ] || { echo "❌ 未找到 rockchip_armv8 内核 $KVER tarball"; exit 1; }
          echo "✅ 三件套资产解析完成"

          # 引擎版本: 取自 tarball 名 openwrt25.12.5-oaf_v7.0.1-x86_64-... -> 7.0.1
          ENGINE_VER=$(basename "$X86_TARBALL" | sed -E 's/^openwrt[0-9.]+-oaf_v([0-9.]+)-.*/\1/')
          echo "ENGINE_VER=$ENGINE_VER" >> $GITHUB_ENV
          echo "引擎版本: $ENGINE_VER"

      - name: Download apk files and kernel tarballs
        run: |
          mkdir -p oaf-x86 oaf-arm64 kmods-x86 kmods-arm64
          wget "$MAIN_URL" -P oaf-x86/ 2>/dev/null || echo "⚠️ 无主 apk 资产"
          wget "$I18N_URL" -P oaf-x86/ 2>/dev/null || echo "⚠️ 无 zh-cn i18n 资产"
          cp oaf-x86/*.apk oaf-arm64/ 2>/dev/null || true
          wget "$X86_TARBALL" -P kmods-x86/ 2>/dev/null
          wget "$ARM_TARBALL" -P kmods-arm64/ 2>/dev/null
          tar -xzf kmods-x86/*.tar.gz -C kmods-x86/
          tar -xzf kmods-arm64/*.tar.gz -C kmods-arm64/
          # 引擎 + 内核模块分别并入对应架构的 .run 目录
          cp kmods-x86/*/appfilter-*.apk kmods-x86/*/kmod-oaf-*.apk oaf-x86/
          cp kmods-arm64/*/appfilter-*.apk kmods-arm64/*/kmod-oaf-*.apk oaf-arm64/
          ls -lh oaf-x86/ oaf-arm64/

      - name: Patch kmod-oaf kernel dependency (fuzzy prefix match)
        run: |
          # kmod-oaf 的 depends 以 OpenWrt 内核配置哈希钉扎, 与 imm 不匹配;
          # 改写为 kernel~<ver>(fuzzy 前缀)使任意 imm 同内核目标可安装(见 shell/patch_apk3.py)
          for f in oaf-x86/kmod-oaf-*.apk oaf-arm64/kmod-oaf-*.apk; do
            python3 shell/patch_apk3.py --kernel-fuzzy "$f" "$f.tmp" --dump || exit 1
            mv "$f.tmp" "$f"
          done
          # 自检: 重新解析补丁后的 apk 并跑单元测试(真实夹具)
          python3 shell/test_patch_apk3.py oaf-x86/kmod-oaf-*.apk oaf-arm64/kmod-oaf-*.apk

      - name: Create install.sh script
        run: |
          for d in oaf-x86 oaf-arm64; do
            cp shell/install25.sh "$d/install.sh"
            chmod +x "$d/install.sh"
          done

      - name: Normalize apk file names (规范为 name-version.apk, imagebuilder 本地索引依赖)
        run: python3 shell/normalize_apk_names.py

      - name: Move directories to makeself
        run: mv oaf-x86 oaf-arm64 makeself/

      - name: Create self-extracting packages
        run: |
          cd makeself
          # 引擎版本号标识 .run; 架构后缀决定同步分类: x86_64 -> run/x86, aarch64_generic -> run/arm64
          ./makeself.sh oaf-x86/ 25-luci-app-oaf-${ENGINE_VER}_x86_64.run "by github action" ./install.sh
          ./makeself.sh oaf-arm64/ 25-luci-app-oaf-${ENGINE_VER}_aarch64_generic.run "by github action" ./install.sh

      - name: Check file sizes
        run: ls -lh makeself/*.run

      - name: Set tag name
        id: vars
        run: |
          TODAY=$(date -u -d '+8 hour' +'%Y-%m-%d')
          echo "tag_name=$TODAY" >> $GITHUB_ENV

      - name: Upload run files as release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.tag_name }}
          name: "Daily Build - ${{ env.tag_name }}"
          files: makeself/*.run
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
             <p align="left">
              <img src="https://img.shields.io/github/downloads/passengerya/CloudRunFilesBuilder/${{ env.tag_name }}/total?style=for-the-badge&label=%E4%BB%8A%E6%97%A5%E4%B8%8B%E8%BD%BD%E6%AC%A1%E6%95%B0&labelColor=blue&color=black"/>
             </p>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Sync Store (builder 全部构建完成后即时触发同步)
        if: success()
        env:
          SYNC_DISPATCH_TOKEN: ${{ secrets.SYNC_DISPATCH_TOKEN }}
        run: |
          if [ -z "$SYNC_DISPATCH_TOKEN" ]; then
            echo "⏭️ 未配置 SYNC_DISPATCH_TOKEN, 跳过通知(依赖 23:00 UTC 定时同步)"
            exit 0
          fi
          # 领导选举: 等 15s 让同期启动的构建全部入队, 然后由「最新启动且仍在运行/排队」
          # 的运行发通知——确定性单通知, 不依赖其它构建的完成状态(轮询方式会死锁:
          # 各运行的等待本身让对方永远看到"运行中")。更晚启动的构建完成后会自行通知。
          sleep 15
          my_ts=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/passengerya/CloudRunFilesBuilder/actions/runs?per_page=100" \
            | jq -r --argjson rid "$GITHUB_RUN_ID" '.workflow_runs[] | select(.id == $rid) | .created_at')
          newer=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/passengerya/CloudRunFilesBuilder/actions/runs?per_page=100" \
            | jq --argjson rid "$GITHUB_RUN_ID" --arg ts "$my_ts" \
            '[.workflow_runs[] | select(.id != $rid and ((.created_at > $ts) or (.created_at == $ts and .id > $rid)) and (.status == "in_progress" or .status == "queued"))] | length')
          if [ "$newer" != "0" ]; then
            echo "⏳ 有 $newer 个更晚启动的构建运行中, 由它们完成后通知 Sync Store"
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: token $SYNC_DISPATCH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/passengerya/AutoBuildTWrt/dispatches" \
            -d '{"event_type":"builder-done"}')
          echo "✅ 已通知 Sync Store (HTTP $code)"

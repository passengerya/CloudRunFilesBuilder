# 进阶设置 luci-app-advancedplus (sirpdboy; 与 argon-config 冲突, 勿同时集成)
name: Build 24.10 AdvancedPlus

on:
  schedule:
    - cron: "13 22 * * *"  # 北京时间早上 6 点 13
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Clone makeself repository
        run: git clone https://github.com/megastep/makeself.git

      - name: Fetch latest release info
        run: |
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/sirpdboy/luci-app-advancedplus/releases \
            | jq 'map(select(.prerelease==false)) | sort_by(.published_at) | last' \
            > release.json

      - name: Parse asset download URLs
        run: |
          LUCI_URL=$(jq -r '.assets[] | select(.name | test("^luci-app-advancedplus_.*\\.ipk$")) | .browser_download_url' release.json)
          I18N_URL=$(jq -r '.assets[] | select(.name | test("^luci-i18n-advancedplus-zh-cn_.*\\.ipk$")) | .browser_download_url' release.json)
          echo "LUCI_URL=$LUCI_URL" >> $GITHUB_ENV
          echo "I18N_URL=$I18N_URL" >> $GITHUB_ENV

          # 从 ipk 文件名提取版本号 如 luci-app-advancedplus_1.8.7-r20251116_all.ipk -> 1.8.7-r20251116
          VERSION=$(echo "$LUCI_URL" | sed -n 's/.*luci-app-advancedplus_\([0-9][^_]*\)_.*/\1/p')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "提取到版本号: $VERSION"

      - name: Download ipk files
        run: |
          mkdir -p advancedplus
          wget "$LUCI_URL" -P advancedplus/
          wget "$I18N_URL" -P advancedplus/ 2>/dev/null || echo "无 i18n 资产, 跳过"
          ls -lh advancedplus/

      - name: Create install.sh script
        run: |
          cat <<EOF > advancedplus/install.sh
          #!/bin/sh
          opkg update
          if [ \$? -ne 0 ]; then
              echo "update failed。"
              exit 1
          fi
          opkg install *.ipk
          EOF
          chmod +x advancedplus/install.sh

      - name: Move directory to makeself
        run: mv advancedplus makeself/

      - name: Create self-extracting package
        run: |
          cd makeself
          ./makeself.sh advancedplus/ luci-app-advancedplus-${VERSION}_all.run "by github action" ./install.sh

      - name: Check file sizes
        run: ls -lh makeself/*.run

      - name: Set tag name
        id: vars
        run: |
          TODAY=$(date -u -d '+8 hour' +'%Y-%m-%d')
          echo "tag_name=$TODAY" >> $GITHUB_ENV

      - name: Upload run files as release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.tag_name }}
          name: "Daily Build - ${{ env.tag_name }}"
          files: makeself/*.run
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
             <p align="left">
              <img src="https://img.shields.io/github/downloads/passengerya/CloudRunFilesBuilder/${{ env.tag_name }}/total?style=for-the-badge&label=%E4%BB%8A%E6%97%A5%E4%B8%8B%E8%BD%BD%E6%AC%A1%E6%95%B0&labelColor=blue&color=black"/>
             </p>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Sync Store (builder 全部构建完成后即时触发同步)
        if: success()
        env:
          SYNC_DISPATCH_TOKEN: ${{ secrets.SYNC_DISPATCH_TOKEN }}
        run: |
          # 门控+轮询: 其它构建结束时仍有 post 阶段(状态短暂保持 in_progress),
          # 需等待其彻底结束后再判断, 避免并发完成时无人通知
          for i in 1 2 3 4 5 6; do
            others=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/passengerya/CloudRunFilesBuilder/actions/runs?per_page=100" \
              | jq --argjson rid "$GITHUB_RUN_ID" '[.workflow_runs[] | select(.id != $rid and (.status == "in_progress" or .status == "queued"))] | length')
            if [ "$others" = "0" ]; then
              code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                -H "Authorization: token $SYNC_DISPATCH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/passengerya/AutoBuildImmortalTWrt/dispatches" \
                -d '{"event_type":"builder-done"}')
              echo "✅ 已通知 Sync Store (HTTP $code)"
              exit 0
            fi
            echo "⏳ 仍有 $others 个构建运行中, 15s 后重试 ($i/6)"
            sleep 15
          done
          echo "⏳ 6 次检查后仍有构建运行中, 放弃本次通知(由最后完成者或 23:00 UTC 定时兜底)"


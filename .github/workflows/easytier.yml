# 组网 easytier (EasyTier/luci-app-easytier, release 资产为 ipk 压缩包)
name: Build 24.10 EasyTier

on:
  schedule:
    - cron: "17 22 * * *"  # 北京时间早上 6 点 17
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Clone makeself repository
        run: git clone https://github.com/megastep/makeself.git

      - name: Fetch latest release info
        run: |
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/EasyTier/luci-app-easytier/releases \
            | jq 'map(select(.prerelease==false)) | sort_by(.published_at) | last' \
            > release.json

      - name: Parse asset download URLs
        run: |
          # release 资产为按平台打包的 zip(内含 ipk), 选取 openwrt 24.10 对应的 22.03 系列
          X86_URL=$(jq -r '.assets[] | select(.name | test("EasyTier-.*-x86_64-22\\.03\\..*\\.zip$")) | .browser_download_url' release.json | head -n1)
          ARM_URL=$(jq -r '.assets[] | select(.name | test("EasyTier-.*-aarch64_generic-22\\.03\\..*\\.zip$")) | .browser_download_url' release.json | head -n1)
          A53_URL=$(jq -r '.assets[] | select(.name | test("EasyTier-.*-aarch64_cortex-a53-22\\.03\\..*\\.zip$")) | .browser_download_url' release.json | head -n1)

          echo "X86_URL=$X86_URL" >> $GITHUB_ENV
          echo "ARM_URL=$ARM_URL" >> $GITHUB_ENV
          echo "A53_URL=$A53_URL" >> $GITHUB_ENV

          # 从 x86 的 zip 文件名提取版本号 如 EasyTier-v2.6.4-x86_64-22.03.7.zip -> v2.6.4
          VERSION=$(echo "$X86_URL" | sed -n 's/.*EasyTier-\(v[0-9][^_-]*\)-x86_64-.*/\1/p')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "提取到版本号: $VERSION"

      - name: Download and unzip ipk packages
        run: |
          mkdir -p x86 arm64 a53
          wget "$X86_URL" -O x86.zip 2>/dev/null && unzip -o x86.zip -d x86/ >/dev/null && rm x86.zip || echo "⚠️ 无 x86 资产"
          wget "$ARM_URL" -O arm64.zip 2>/dev/null && unzip -o arm64.zip -d arm64/ >/dev/null && rm arm64.zip || echo "⚠️ 无 aarch64_generic 资产"
          wget "$A53_URL" -O a53.zip 2>/dev/null && unzip -o a53.zip -d a53/ >/dev/null && rm a53.zip || echo "⚠️ 无 aarch64_cortex-a53 资产"
          # 删除与主包冲突的变体: easytier-noweb 与 easytier 提供相同二进制
          # (check_data_file_clashes); luci-i18n-easytier-zh-cn 的文件已由
          # luci-app-easytier 内置, 再装会冲突
          find x86 arm64 a53 -name 'easytier-noweb_*.ipk' -delete 2>/dev/null || true
          find x86 arm64 a53 -name 'luci-i18n-easytier-zh-cn_*.ipk' -delete 2>/dev/null || true
          find . -name "*.ipk" | head -20

      - name: Create install.sh scripts
        run: |
          cat <<EOF > x86/install.sh
          #!/bin/sh
          opkg update
          if [ \$? -ne 0 ]; then
              echo "update failed。"
              exit 1
          fi
          opkg install *.ipk
          EOF
          chmod +x x86/install.sh
          cp x86/install.sh arm64/install.sh
          cp x86/install.sh a53/install.sh

      - name: Move directories to makeself
        run: |
          mv x86 makeself/
          mv arm64 makeself/
          mv a53 makeself/

      - name: Create self-extracting packages
        run: |
          cd makeself
          [ -n "$(find x86 -name '*.ipk')" ] && ./makeself.sh x86/ easytier_${VERSION}_x86_64.run "by github action" ./install.sh || echo "跳过 x86"
          [ -n "$(find arm64 -name '*.ipk')" ] && ./makeself.sh arm64/ easytier_${VERSION}_aarch64_generic.run "by github action" ./install.sh || echo "跳过 aarch64_generic"
          [ -n "$(find a53 -name '*.ipk')" ] && ./makeself.sh a53/ easytier_${VERSION}_aarch64_cortex-a53.run "by github action" ./install.sh || echo "跳过 aarch64_cortex-a53"

      - name: Check file sizes
        run: ls -lh makeself/*.run

      - name: Set tag name
        id: vars
        run: |
          TODAY=$(date -u -d '+8 hour' +'%Y-%m-%d')
          echo "tag_name=$TODAY" >> $GITHUB_ENV

      - name: Upload run files as release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.tag_name }}
          name: "Daily Build - ${{ env.tag_name }}"
          files: makeself/*.run
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
             <p align="left">
              <img src="https://img.shields.io/github/downloads/passengerya/CloudRunFilesBuilder/${{ env.tag_name }}/total?style=for-the-badge&label=%E4%BB%8A%E6%97%A5%E4%B8%8B%E8%BD%BD%E6%AC%A1%E6%95%B0&labelColor=blue&color=black"/>
             </p>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Sync Store (builder 全部构建完成后即时触发同步)
        if: success()
        env:
          SYNC_DISPATCH_TOKEN: ${{ secrets.SYNC_DISPATCH_TOKEN }}
        run: |
          # 领导选举: 等 15s 让同期启动的构建全部入队, 然后由「最新启动且仍在运行/排队」
          # 的运行发通知——确定性单通知, 不依赖其它构建的完成状态(轮询方式会死锁:
          # 各运行的等待本身让对方永远看到"运行中")。更晚启动的构建完成后会自行通知。
          sleep 15
          my_ts=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/passengerya/CloudRunFilesBuilder/actions/runs?per_page=100" \
            | jq -r --argjson rid "$GITHUB_RUN_ID" '.workflow_runs[] | select(.id == $rid) | .created_at')
          newer=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/passengerya/CloudRunFilesBuilder/actions/runs?per_page=100" \
            | jq --argjson rid "$GITHUB_RUN_ID" --arg ts "$my_ts" \
            '[.workflow_runs[] | select(.id != $rid and ((.created_at > $ts) or (.created_at == $ts and .id > $rid)) and (.status == "in_progress" or .status == "queued"))] | length')
          if [ "$newer" != "0" ]; then
            echo "⏳ 有 $newer 个更晚启动的构建运行中, 由它们完成后通知 Sync Store"
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: token $SYNC_DISPATCH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/passengerya/AutoBuildTWrt/dispatches" \
            -d '{"event_type":"builder-done"}')
          echo "✅ 已通知 Sync Store (HTTP $code)"


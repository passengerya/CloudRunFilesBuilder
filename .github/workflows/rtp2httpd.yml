# IPTV 流媒体转发 rtp2httpd (stackia/rtp2httpd)
name: Build 24.10 rtp2httpd

on:
  schedule:
    - cron: "16 22 * * *"  # 北京时间早上 6 点 16
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Clone makeself repository
        run: git clone https://github.com/megastep/makeself.git

      - name: Fetch latest release info
        run: |
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/stackia/rtp2httpd/releases \
            | jq 'map(select(.prerelease==false)) | sort_by(.published_at) | last' \
            > release.json

      - name: Parse asset download URLs
        run: |
          X86_URL=$(jq -r '.assets[] | select(.name | test("^rtp2httpd_.*_x86_64\\.ipk$")) | .browser_download_url' release.json)
          ARM_URL=$(jq -r '.assets[] | select(.name | test("^rtp2httpd_.*_aarch64_generic\\.ipk$")) | .browser_download_url' release.json)
          A53_URL=$(jq -r '.assets[] | select(.name | test("^rtp2httpd_.*_aarch64_cortex-a53\\.ipk$")) | .browser_download_url' release.json)
          LUCI_URL=$(jq -r '.assets[] | select(.name | test("^luci-app-rtp2httpd_.*\\.ipk$")) | .browser_download_url' release.json)
          I18N_URL=$(jq -r '.assets[] | select(.name | test("^luci-i18n-rtp2httpd-zh-cn_.*\\.ipk$")) | .browser_download_url' release.json)

          echo "X86_URL=$X86_URL" >> $GITHUB_ENV
          echo "ARM_URL=$ARM_URL" >> $GITHUB_ENV
          echo "A53_URL=$A53_URL" >> $GITHUB_ENV
          echo "LUCI_URL=$LUCI_URL" >> $GITHUB_ENV
          echo "I18N_URL=$I18N_URL" >> $GITHUB_ENV

          # 从 x86 的 rtp2httpd 文件名提取版本号 如 rtp2httpd_3.17.1-r1_x86_64.ipk -> 3.17.1-r1
          VERSION=$(jq -r '.assets[] | select(.name | test("^rtp2httpd_.*_x86_64\\.ipk$")) | .name' release.json | head -n1 | sed -n 's/^rtp2httpd_\([0-9][^_]*\)_x86_64\.ipk$/\1/p')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "提取到版本号: $VERSION"

      - name: Download ipk files
        run: |
          mkdir -p x86 arm64 a53
          wget "$X86_URL" -P x86/ 2>/dev/null || echo "⚠️ 无 x86 资产"
          wget "$ARM_URL" -P arm64/ 2>/dev/null || echo "⚠️ 无 aarch64_generic 资产"
          wget "$A53_URL" -P a53/ 2>/dev/null || echo "⚠️ 无 aarch64_cortex-a53 资产"

          for d in x86 arm64 a53; do
            wget "$LUCI_URL" -P $d/ 2>/dev/null || true
            wget "$I18N_URL" -P $d/ 2>/dev/null || true
          done
          ls -lh */*.ipk 2>/dev/null | cat

      - name: Create install.sh scripts
        run: |
          cat <<EOF > x86/install.sh
          #!/bin/sh
          opkg update
          if [ \$? -ne 0 ]; then
              echo "update failed。"
              exit 1
          fi
          opkg install *.ipk
          EOF
          chmod +x x86/install.sh
          cp x86/install.sh arm64/install.sh
          cp x86/install.sh a53/install.sh

      - name: Move directories to makeself
        run: |
          mv x86 makeself/
          mv arm64 makeself/
          mv a53 makeself/

      - name: Create self-extracting packages
        run: |
          cd makeself
          [ -n "$(ls x86/*.ipk 2>/dev/null)" ] && ./makeself.sh x86/ rtp2httpd_${VERSION}_x86_64.run "by github action" ./install.sh || echo "跳过 x86"
          [ -n "$(ls arm64/*.ipk 2>/dev/null)" ] && ./makeself.sh arm64/ rtp2httpd_${VERSION}_aarch64_generic.run "by github action" ./install.sh || echo "跳过 aarch64_generic"
          [ -n "$(ls a53/*.ipk 2>/dev/null)" ] && ./makeself.sh a53/ rtp2httpd_${VERSION}_aarch64_cortex-a53.run "by github action" ./install.sh || echo "跳过 aarch64_cortex-a53"

      - name: Check file sizes
        run: ls -lh makeself/*.run

      - name: Set tag name
        id: vars
        run: |
          TODAY=$(date -u -d '+8 hour' +'%Y-%m-%d')
          echo "tag_name=$TODAY" >> $GITHUB_ENV

      - name: Upload run files as release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.tag_name }}
          name: "Daily Build - ${{ env.tag_name }}"
          files: makeself/*.run
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
             <p align="left">
              <img src="https://img.shields.io/github/downloads/passengerya/CloudRunFilesBuilder/${{ env.tag_name }}/total?style=for-the-badge&label=%E4%BB%8A%E6%97%A5%E4%B8%8B%E8%BD%BD%E6%AC%A1%E6%95%B0&labelColor=blue&color=black"/>
             </p>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Sync Store (builder 全部构建完成后即时触发同步)
        if: success()
        env:
          SYNC_DISPATCH_TOKEN: ${{ secrets.SYNC_DISPATCH_TOKEN }}
        run: |
          # 领导选举: 等 15s 让同期启动的构建全部入队, 然后由「最新启动且仍在运行/排队」
          # 的运行发通知——确定性单通知, 不依赖其它构建的完成状态(轮询方式会死锁:
          # 各运行的等待本身让对方永远看到"运行中")。更晚启动的构建完成后会自行通知。
          sleep 15
          my_ts=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/passengerya/CloudRunFilesBuilder/actions/runs?per_page=100" \
            | jq -r --argjson rid "$GITHUB_RUN_ID" '.workflow_runs[] | select(.id == $rid) | .created_at')
          newer=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/passengerya/CloudRunFilesBuilder/actions/runs?per_page=100" \
            | jq --argjson rid "$GITHUB_RUN_ID" --arg ts "$my_ts" \
            '[.workflow_runs[] | select(.id != $rid and ((.created_at > $ts) or (.created_at == $ts and .id > $rid)) and (.status == "in_progress" or .status == "queued"))] | length')
          if [ "$newer" != "0" ]; then
            echo "⏳ 有 $newer 个更晚启动的构建运行中, 由它们完成后通知 Sync Store"
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: token $SYNC_DISPATCH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/passengerya/AutoBuildTWrt/dispatches" \
            -d '{"event_type":"builder-done"}')
          echo "✅ 已通知 Sync Store (HTTP $code)"

